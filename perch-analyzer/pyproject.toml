[project]
name = "perch-analyzer"
version = "0.1.0"
description = "Program to build bioacoustics classifiers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jax>=0.9.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.0",
    "nicegui>=3.17.1",
    "perch-hoplite",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scipy>=1.16.0",
    "sqlalchemy>=2.0.46",
    "tensorflow>=2.20.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perch_analyzer"]

[tool.uv]
package = true

[tool.uv.sources]
perch-hoplite = { git = "https://github.com/google-research/perch-hoplite.git", rev = "81ea84238bf03b5ab3358b87fec5ceb6fbf1b074" }

[dependency-groups]
dev = [
    "py-spy>=0.4.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
perch-analyzer = "perch_analyzer.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "LOG", "RUF"]
# The formatter owns line wrapping; a few long URLs and messages stay as-is.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ported from the Perch repository; kept structurally close to upstream.
"src/perch_analyzer/target_recordings/audio_utils.py" = ["RUF"]
"src/perch_analyzer/target_recordings/signal.py" = ["RUF"]

[tool.pyrefly]
# `scripts/` holds one-off research scripts and is deliberately not checked.
project-includes = ["src", "tests"]
preset = "strict"

[[tool.pyrefly.sub-config]]
# Ported from the Perch repository; kept structurally close to upstream.
matches = "src/perch_analyzer/target_recordings/audio_utils.py"
[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The NiceGUI test plugin otherwise looks for a `main.py` to run; this project
# builds its pages from a fixture instead.
main_file = ""
testpaths = ["tests"]
